services:
  - type: web
    name: clipvlip-worker
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: CLIPVLIP_DATA
        value: /tmp/clipvlip-data
      - key: CLIPVLIP_ACCESS_KEY
        sync: false
      - key: CLIPVLIP_MAX_UPLOAD_BYTES
        value: "262144000"
      - key: CLIPVLIP_MAX_SOURCE_SIZE
        value: 250M
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SOURCE_BUCKET
        value: clipvlip-sources
      - key: SUPABASE_OUTPUT_BUCKET
        value: clipvlip-outputs
