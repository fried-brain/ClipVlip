name: Publish Android bundle to Google Play
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed GitHub release tag (for example v0.2.0)
        required: true
        type: string
      track:
        description: Google Play release track
        required: true
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
permissions:
  contents: read
jobs:
  publish:
    if: ${{ vars.GOOGLE_PLAY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the already-signed release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.aab' --dir release
      - name: Verify bundle exists
        run: test -s release/app-release.aab
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.friedbrain.clipvlip
          releaseFiles: release/app-release.aab
          track: ${{ inputs.track }}
          status: draft
