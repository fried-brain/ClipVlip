name: Android signed release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: android-release
  queue: max
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.4" }
      - name: Decode Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Configure Android signing secrets before tagging a release." && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/clipvlip.jks"
      - name: Derive and validate monotonic Android version code
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Release tag must be exactly vMAJOR.MINOR.PATCH" >&2; exit 1; }
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          (( major <= 2099 && minor <= 999 && patch <= 999 )) || { echo "Release version exceeds supported Android version-code range" >&2; exit 1; }
          code=$((major * 1000000 + minor * 1000 + patch + 1))
          (( code > 0 && code <= 2100000000 )) || { echo "Release version code is outside Android supported range" >&2; exit 1; }
          latest_tag="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s -r --arg current "$GITHUB_REF_NAME" '
            [ .[][] 
              | select(.draft == false and .prerelease == false and .tag_name != $current)
              | .tag_name
              | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
              | . as $tag
              | (capture("^v(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)$")) as $version
              | {tag: $tag, major: ($version.major | tonumber), minor: ($version.minor | tonumber), patch: ($version.patch | tonumber)}
            ]
            | if length == 0 then empty else max_by([.major, .minor, .patch]).tag end
          ')"
          if [[ -n "$latest_tag" ]]; then
            latest="${latest_tag#v}"
            [[ "$latest" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Latest published release tag is not semantic: $latest_tag" >&2; exit 1; }
            old_code=$(("${BASH_REMATCH[1]}" * 1000000 + "${BASH_REMATCH[2]}" * 1000 + "${BASH_REMATCH[3]}" + 1))
            (( code > old_code )) || { echo "Refusing non-monotonic release $GITHUB_REF_NAME ($code); latest release $latest_tag has version code $old_code" >&2; exit 1; }
          fi
          echo "version_code=$code" >> "$GITHUB_OUTPUT"
      - name: Build signed APK and AAB
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ github.ref_name }}
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_PATH: ${{ runner.temp }}/clipvlip.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android :app:assembleRelease :app:bundleRelease
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          append_body: true
          body: "ClipVlip-Version-Code: ${{ steps.version.outputs.version_code }}"
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
